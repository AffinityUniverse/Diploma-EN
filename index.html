<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>English Diploma</title>
<style>
  @font-face {
    font-family: 'SpokaHanSansNeo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SpoqaHanSansNeo-Thin.woff') format('woff');
    font-weight: 100;
    font-display: swap;
  }
  @font-face {
    font-family: 'SpokaHanSansNeo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SpoqaHanSansNeo-Light.woff') format('woff');
    font-weight: 300;
    font-display: swap;
  }
  @font-face {
    font-family: 'SpokaHanSansNeo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SpoqaHanSansNeo-Regular.woff') format('woff');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'SpokaHanSansNeo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SpoqaHanSansNeo-Medium.woff') format('woff');
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: 'SpokaHanSansNeo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SpoqaHanSansNeo-Bold.woff') format('woff');
    font-weight: 700;
    font-display: swap;
  }

  :root {
    color-scheme: dark;
    --bg: #0D1D32;
    --text: #ffffff;
    --muted: rgba(255,255,255,.58);
    --line: rgba(255,255,255,.16);
    --card: #ffffff;
    --card-text: #111111;
    --card-muted: #777777;
    --yellow: #63B0FF;
    --yellow-soft: #F2F8FF;
    --navy-2: #153657;
    --navy-3: #1D4A76;
    --navy-4: #2E6FA8;
    --ice-blue: #63B0FF;
    --radius: 22px;
    --shadow: 0 14px 40px rgba(0,0,0,.18);
    font-family: 'SpokaHanSansNeo', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'SpokaHanSansNeo', sans-serif;
  }
  button { font: inherit; }
  button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 4px;
  }

  .app {
    min-height: 100vh;
    background:
      radial-gradient(circle at 82% 12%, rgba(72,156,255,.36), transparent 30%),
      linear-gradient(145deg, #0D1D32 0%, #173C63 52%, #0D1D32 100%);
  }

  /* ---------- COURSE LIST ---------- */
  .list-page {
    position: relative;
    isolation: isolate;
    width: min(1180px, calc(100% - 48px));
    margin: 0 auto;
    padding: 84px 0 104px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    padding: 0 11px;
    border-radius: 999px;
    background: rgba(99,176,255,.12);
    border: 1px solid rgba(99,176,255,.22);
    color: rgba(99,176,255,.92);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .list-page h1 {
    margin: 16px 0 12px;
    font-size: clamp(38px, 5vw, 62px);
    line-height: 1.06;
    letter-spacing: -.045em;
    font-weight: 700;
    text-shadow: 0 8px 30px rgba(0,0,0,.14);
  }
  .lead {
    margin: 0 0 40px;
    color: rgba(232,239,255,.70);
    line-height: 1.75;
    font-size: 15px;
    font-weight: 400;
  }
  .lesson-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  .lesson-card {
    appearance: none;
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "title arrow" "meta arrow";
    column-gap: 22px;
    row-gap: 3px;
    align-items: center;
    min-height: 146px;
    padding: 28px 28px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 28px;
    background: rgba(255,255,255,.96);
    color: var(--card-text);
    text-align: left;
    box-shadow: 0 14px 34px rgba(3,14,29,.16);
  }
  .lesson-card.active {
    cursor: pointer;
    background: linear-gradient(145deg, #ffffff 0%, #f5f9fc 100%);
    border-color: rgba(99,176,255,.30);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .lesson-card.active:hover {
    transform: translateY(-4px);
    border-color: rgba(99,176,255,.52);
    box-shadow: 0 20px 46px rgba(3,14,29,.22);
  }
  .lesson-card .arrow-dot {
    grid-area: arrow;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--navy-3);
    color: #ffffff;
    font-size: 26px;
    line-height: 1;
    transition: transform .18s ease;
  }
  .lesson-card.active:hover .arrow-dot { transform: translateX(2px); }
  .lesson-card strong {
    grid-area: title;
    display: block;
    font-size: 28px;
    line-height: 1.14;
    letter-spacing: -.035em;
    font-weight: 700;
  }
  .lesson-card .meta {
    grid-area: meta;
    color: var(--card-muted);
    font-size: 14px;
    line-height: 1.5;
    font-weight: 400;
  }
  .lesson-card.disabled {
    background: rgba(255,255,255,.78);
    border-color: rgba(255,255,255,.07);
    box-shadow: 0 9px 24px rgba(3,14,29,.08);
  }
  .lesson-card.disabled strong { color: #4d4d4d; }
  .lesson-card.disabled .meta { color: #999999; }
  .lesson-card.disabled .arrow-dot {
    background: #DCE6EF;
    color: #8EA2B5;
    font-size: 18px;
  }

  /* ---------- LESSON VIEW ---------- */
  .lesson-view { min-height: 100vh; background: var(--bg); }
  .toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    z-index: 30;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(13,29,50,.94);
    backdrop-filter: blur(14px);
  }
  .toolbar-left, .toolbar-right { display: flex; gap: 9px; align-items: center; }
  .toolbar-right { justify-content: flex-end; }
  .toolbtn {
    border: 1px solid var(--line);
    background: rgba(255,255,255,.06);
    color: #ffffff;
    border-radius: 12px;
    height: 40px;
    padding: 0 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 500;
  }
  .toolbtn:hover { background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.34); }
  .title-wrap { text-align: center; min-width: 0; }
  .viewer-title {
    font-weight: 700;
    letter-spacing: -.025em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .page-count { margin-top: 3px; font-size: 11px; color: var(--muted); letter-spacing: .05em; }

  .deck {
    height: 100vh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.22) transparent;
    padding-top: 70px;
  }
  .part {
    min-height: calc(100vh - 70px);
    position: relative;
    display: flex;
    justify-content: center;
    padding: 88px 94px 90px;
  }
  .part-inner { width: min(980px, 100%); align-self: flex-start; }
  .part-kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .16em;
    color: rgba(255,255,255,.46);
  }
  .part h2 {
    margin: 12px 0 8px;
    font-size: clamp(32px, 4.6vw, 52px);
    line-height: 1.12;
    letter-spacing: -.04em;
    font-weight: 700;
  }
  .part-description {
    margin: 0 0 34px;
    color: #ffffff;
    font-size: 15px;
    line-height: 1.72;
    font-weight: 400;
  }

  .content-stack { display: grid; gap: 14px; }
  .reveal {
    opacity: 0;
    transform: translateY(34px);
    pointer-events: none;
    visibility: hidden;
  }
  .reveal.is-visible {
    visibility: visible;
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    animation: riseIn .52s cubic-bezier(.22,.75,.25,1) both;
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(34px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .part.entering .part-inner { animation: partEnter .58s ease both; }
  @keyframes partEnter {
    from { opacity: .35; transform: translateY(26px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .language-card {
    background: var(--card);
    color: var(--card-text);
    border-radius: var(--radius);
    padding: 23px 26px;
    box-shadow: var(--shadow);
  }
  .language-card .en {
    margin: 0;
    font-size: clamp(21px, 2.35vw, 30px);
    line-height: 1.34;
    letter-spacing: -.02em;
    font-weight: 700;
    color: #111111;
  }
  .language-card .ko {
    margin: 7px 0 0;
    color: #111111;
    font-size: 14px;
    line-height: 1.72;
    font-weight: 400;
    word-break: keep-all;
  }
  .term-card .en { font-size: clamp(24px, 2.7vw, 34px); }

  /* ---------- PART 2 ---------- */
  .notice-card {
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 20px;
    padding: 20px 22px;
    background: rgba(255,255,255,.08);
    color: #ffffff;
  }
  .notice-label {
    display: inline-block;
    margin-bottom: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(255,255,255,.62);
  }
  .notice-card .en { color:#ffffff; font-size:18px; line-height:1.55; font-weight:700; }
  .notice-card .ko { margin-top:6px; color:#ffffff; font-size:14px; line-height:1.7; font-weight:400; }
  .situation-title {
    margin: 20px 0 2px;
    color: #ffffff;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .situation-title small {
    display: block;
    margin-top: 4px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 400;
  }
  .chat-row { display: flex; width: 100%; }
  .chat-row.teacher { justify-content: flex-start; }
  .chat-row.student { justify-content: flex-end; }
  .bubble {
    width: min(78%, 760px);
    padding: 19px 22px;
    color: #111111;
    box-shadow: 0 10px 28px rgba(0,0,0,.14);
  }
  .teacher .bubble {
    background: #ffffff;
    border-radius: 0 20px 20px 20px;
  }
  .student .bubble {
    background: #63B0FF;
    color: #ffffff;
    border-radius: 20px 0 20px 20px;
  }
  .speaker {
    margin-bottom: 7px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #797979;
  }
  .bubble .en { font-size: 18px; line-height: 1.48; font-weight: 700; }
  .bubble .ko { margin-top: 7px; color: #111111; font-size: 13px; line-height: 1.72; font-weight: 400; }
  .bubble .action-note { color: #555; font-size: 11px; font-weight: 500; margin-bottom: 5px; }
  .student .bubble .speaker { color: rgba(255,255,255,.78); }
  .student .bubble .en { color: #ffffff; }
  .student .bubble .ko { color: rgba(255,255,255,.84); }
  .student .bubble .action-note { color: rgba(255,255,255,.82); }
  .slot { font-weight: 700; border-bottom: 2px solid currentColor; padding: 0 2px; }
  .hint-box {
    width: min(78%, 760px);
    margin-left: auto;
    border-radius: 20px 0 20px 20px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16);
    padding: 20px 22px;
  }
  .hint-box strong { display: block; font-size: 13px; margin-bottom: 11px; }
  .hint-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .hint-list.grouped { flex-direction: column; align-items: flex-start; }
  .hint-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px 12px;
    width: fit-content;
    max-width: 100%;
    padding: 8px 12px;
    border-radius: 999px;
    background: #ffffff;
    color: #111111;
  }
  .hint-row-item {
    display: inline-flex;
    align-items: baseline;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 700;
  }
  .hint-row-item { color: #111111; }
  .hint-row-item > span { font-weight: 400; }
  .hint-row-item + .hint-row-item::before {
    content: '|';
    margin-right: 12px;
    color: #9a9a9a;
    font-weight: 400;
  }
  .hint-row-item span { color: #111111; font-weight: 400; margin-left: 4px; }
  .hint-chip {
    display: inline-block;
    width: fit-content;
    max-width: 100%;
    padding: 8px 11px;
    border-radius: 999px;
    background: #ffffff;
    color: #111111;
    font-size: 12px;
    font-weight: 700;
  }
  .hint-chip span { color: #111111; font-weight: 400; margin-left: 4px; }

  /* ---------- PART 3 ---------- */
  .pattern-section { margin-top: 48px; }
  .pattern-section:first-of-type { margin-top: 12px; }
  .pattern-subtitle {
    color: #ffffff;
    font-size: clamp(22px, 2.6vw, 30px);
    line-height: 1.35;
    font-weight: 700;
    letter-spacing: -.025em;
    margin: 0 0 14px;
  }
  .pattern-subtitle .tag {
    display: inline-block;
    margin-right: 8px;
    color: rgba(255,255,255,.48);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .10em;
    vertical-align: middle;
  }
  .example-label, .quiz-label {
    display: inline-block;
    margin-bottom: 9px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #8c8c8c;
  }
  .quiz-card {
    background: #ffffff;
    color: #111111;
    border-radius: 22px;
    padding: 23px 26px;
    box-shadow: var(--shadow);
    cursor: pointer;
    user-select: none;
  }
  .quiz-card .ko {
    margin: 0 0 13px;
    color: #111111;
    font-size: 14px;
    line-height: 1.74;
    font-weight: 400;
  }
  .masked-answer {
    position: relative;
    display: block;
    font-size: clamp(19px, 2.2vw, 27px);
    line-height: 1.55;
    letter-spacing: -.02em;
    font-weight: 700;
    word-spacing: normal;
  }
  .masked-answer > span { display: inline; }
  .answer-keyword {
    display: inline-block;
    white-space: nowrap;
    color: #111111;
    background: #ffffff;
    position: relative;
    z-index: 1;
    padding: 0 .04em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .mask {
    position: relative;
    display: inline;
    color: transparent;
    background: #111111;
    border-radius: 6px;
    padding: 0 .10em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    transition: background .22s ease, color .22s ease;
  }
  .quiz-question {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-50%, -50%);
    color: #ffffff;
    font-size: .72em;
    line-height: 1;
    font-weight: 700;
    z-index: 4;
    pointer-events: none;
  }
  .quiz-card.revealed .mask {
    color: #111111;
    background: transparent;
    padding-left: 0;
    padding-right: 0;
  }
  .quiz-card.revealed .answer-keyword {
    color: #111111;
    background: transparent;
    padding-left: 0;
    padding-right: 0;
  }
  .quiz-card.revealed .quiz-question { display: none; }

  /* ---------- NAV ---------- */
  .navbtn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 54px;
    height: 72px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.08);
    color: #ffffff;
    backdrop-filter: blur(10px);
    cursor: pointer;
    font-size: 30px;
    display: grid;
    place-items: center;
    z-index: 28;
  }
  .navbtn:hover { background: rgba(255,255,255,.14); }
  .navbtn.prev { left: 20px; }
  .navbtn.next { right: 20px; }
  .navbtn:disabled { opacity: .22; cursor: default; }
  .progress-pill {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 25;
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px;
    background: rgba(13,29,50,.82);
    color: rgba(255,255,255,.72);
    backdrop-filter: blur(10px);
    font-size: 11px;
    pointer-events: none;
  }
  .complete-card {
    margin-top: 18px;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.07);
    padding: 22px;
    text-align: center;
  }
  .complete-card strong { display: block; font-size: 20px; margin-bottom: 5px; }
  .complete-card span { color: #ffffff; font-size: 13px; font-weight: 400; }

  @media (max-width: 980px) {
    .lesson-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .part { padding-left: 72px; padding-right: 72px; }
  }
  @media (max-width: 680px) {
    .list-page { width: min(100% - 24px, 1180px); padding-top: 42px; }
    .lesson-grid { grid-template-columns: 1fr; }
    .lesson-card { min-height: 116px; padding: 20px 18px; border-radius: 20px; }
    .lesson-card strong { font-size: 24px; }
    .lesson-card .arrow-dot { width: 44px; height: 44px; font-size: 21px; }
    .toolbar { grid-template-columns: auto 1fr auto; padding: 0 10px; }
    .toolbtn .label { display: none; }
    .part { padding: 70px 48px 82px; }
    .language-card, .quiz-card { padding: 19px 18px; border-radius: 18px; }
    .bubble { width: 92%; padding: 17px 18px; }
    .hint-box { width: 92%; }
    .navbtn { width: 40px; height: 58px; border-radius: 13px; font-size: 25px; }
    .navbtn.prev { left: 6px; }
    .navbtn.next { right: 6px; }
    .hint-chip { width: 100%; }
    .hint-row { width: 100%; border-radius: 18px; }
    .hint-row-item { white-space: normal; }
    .progress-pill { bottom: 12px; }
  }
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
const app = document.getElementById('app');
const LESSONS = {"1":{"topic":"Design a 3D Room & Handle Audio Problems","terms":[["Perspective","원근법 · 평면에 깊이감과 공간감을 주는 기법"],["Tilt","기울이기 · 도형을 비틀어 입체감을 주는 기능"],["Align Center","가운데 정렬 · 오브젝트의 중심축을 맞추는 기능"],["Stroke","테두리 선 · 도형의 바깥 선 색상 및 두께"],["Convert to Curves","곡선 변환 · Ctrl + Enter를 눌러 도형의 모양을 자유롭게 바꿀 수 있게 깨뜨리는 기능"]],"brainstormKo":"본격적으로 그리기 전에 내 방을 상상하며 입을 열어봅시다!","s1":{"title":"“What's in your room?”","subtitle":"내 방 가구 소개하기","messages":[{"role":"teacher","en":"Imagine your own room. What do you have in your room?","ko":"여러분의 방을 상상해 보세요. 방 안에 무엇이 있나요?"},{"role":"student","en":"In my room, I have a <span class=\"slot\">[ Furniture 1 ]</span> and a <span class=\"slot\">[ Furniture 2 ]</span>.","ko":"제 방에는 [ 가구 1 ]과 [ 가구 2 ]가 있어요!","group":"s1-hint"},{"role":"teacher","en":"That sounds nice! Do you have a pillow on your bed?","ko":"좋네요! 침대 위에 베개가 있나요?"},{"role":"student","en":"Yes! I have a <span class=\"slot\">[ Shape / Color ]</span> pillow on my bed.","ko":"네! 침대 위에 [ 모양/색상 ] 베개가 있어요."}],"hint":{"after":1,"group":"s1-hint","label":"가구/소품 단어 힌트","items":[["Desk","책상"],["Bed","침대"],["Chair","의자"],["Closet","옷장"],["Bookshelf","책장"],["Side table","협탁"],["Lamp","조명"],["Cushion","쿠션"]]}},"s2":{"title":"Problem Solving","subtitle":"돌발 상황 해결","missionEn":"Your student's microphone suddenly stops working during class! Handle the situation calmly as a teacher using the script below.","missionKo":"수업 도중 갑자기 학생의 마이크 소리가 들리지 않는 상황입니다. 아래 스크립트로 문제를 해결해 보세요.","messages":[{"role":"teacher","en":"Zack, I can't hear you! Do you have a headset? If you do, can you click an emoji?","ko":"잭, 목소리가 안 들려요! 혹시 헤드셋 가지고 있나요? 있다면 이모지를 눌러줄 수 있나요?"},{"role":"student","en":"💬 “My microphone is not working, and I don’t have a headset.”","ko":"제 마이크가 작동하지 않고, 헤드셋도 없어요.","note":"Types in chat"},{"role":"teacher","en":"No problem, we can use the chat today! Can you click an emoji if you can hear me?","ko":"괜찮아요, 오늘은 채팅창을 쓰면 됩니다! 선생님 말이 잘 들린다면 이모지를 눌러줄 수 있나요?"},{"role":"student","en":"👍","ko":"이모지를 클릭합니다.","note":"Click emoji"},{"role":"teacher","en":"Perfect! Let's check your mic setup after class. For now, let’s keep drawing!","ko":"좋아요! 수업 끝나고 마이크 설정을 같이 체크해 봐요. 지금은 계속 그려봅시다!"}]},"patterns":[{"tag":"INSTRUCTION","title":"Turning Off Options","koTitle":"옵션 끄고 그리기","examples":[["Turn off the stroke color and just draw the rectangle.","테두리 색은 끄고 그냥 직사각형을 그려보세요."],["Turn off the grid and just draw lines freely.","그리드를 끄고 그냥 선을 자유롭게 그려보세요."]],"quizKo":"브러시 효과를 끄고 그냥 동그라미를 그려보세요.","answer":"Turn off the brush effect and just draw a circle."},{"tag":"SHORTCUT","title":"Converting Functions","koTitle":"단축키로 기능 전환하기","examples":[["Convert this rectangle into curves by pressing Ctrl and Enter together.","Ctrl과 Enter를 같이 눌러서 이 사각형을 커브로 변환해 보세요."],["Convert this line into a shape by pressing Alt and Enter together.","Alt와 Enter를 같이 눌러서 이 선을 도형으로 변환해 보세요."]],"quizKo":"Ctrl과 Enter를 같이 눌러서 이 동그라미를 커브로 변환해 보세요.","answer":"Convert this circle into curves by pressing Ctrl and Enter together."},{"tag":"GUIDE","title":"Checking the Mouse Cursor","koTitle":"마우스 커서 모양 확인하기","examples":[["If you move your mouse near the bottom center node, the cursor will change into a double-headed arrow.","가운데 아래 점 근처로 마우스를 옮기면 커서가 양쪽 화살표 모양으로 바뀔 거예요."],["If you move your mouse near the handle, the cursor will change into a curved arrow.","핸들 근처로 마우스를 옮기면 커서가 회전 화살표 모양으로 바뀔 거예요."]],"quizKo":"모서리 근처로 마우스를 옮기면 커서가 양쪽 화살표 모양으로 바뀔 거예요.","answer":"If you move your mouse near the corner, the cursor will change into a double-headed arrow."},{"tag":"PRAISE","title":"Praising Visual Changes","koTitle":"시각적 변화 칭찬하기","examples":[["You added color this time, so it looks much more realistic.","이번에 색을 넣으시니까 훨씬 더 사실적으로 보이네요!"],["You added some shadows, so it looks much more 3D.","그림자를 좀 넣으시니까 훨씬 더 입체감 있어 보이네요!"]],"quizKo":"디테일을 추가하시니까 훨씬 더 멋져 보이네요!","answer":"You added details, so it looks much cooler!"}]},"2":{"topic":"Design a High-Angle Street View & Handle Program Crashes","terms":[["High-angle view","조감도 시점 (하늘에서 새처럼 아래를 내려다보는 시점)"],["Arrange","순서 정렬 (레이어의 순서를 맨 앞(Front)이나 맨 뒤(Back)로 정렬하는 기능)"],["Pathfinder","도형 연산 (두 개 이상의 도형을 합치거나 깎아내어 새로운 형태를 만드는 기능)"],["Duplicate","복제하기 (단축키나 드래그를 이용해 오브젝트를 똑같이 복제하는 기능)"],["Align","정렬하기 (오브젝트들을 왼쪽, 가운데, 오른쪽 등 기준선에 맞춰 깔끔하게 정렬하는 기능)"]],"brainstormKo":"","s1":{"title":"“What can you see from the sky?”","subtitle":"조감도 거리 풍경 상상하기","messages":[{"role":"teacher","en":"Imagine we are flying in the sky like birds, looking straight down at the street! What can you see from up there?","ko":"우리가 새처럼 하늘을 날며 거리를 내려다본다고 상상해 보세요! 저 아래 무엇이 보이나요?"},{"role":"student","en":"I can see a <span class=\"slot\">[ 오브젝트 1 ]</span> and a very small <span class=\"slot\">[ 오브젝트 2 ]</span>.","ko":"[ 오브젝트 1 ]과 아주 작은 [ 오브젝트 2 ]가 보여요.","group":"s1-object-hint"},{"role":"teacher","en":"What kind of exciting story is happening on your street?","ko":"여러분 거리에서는 어떤 흥미진진한 이야기가 펼쳐지고 있나요?"},{"role":"student","en":"A <span class=\"slot\">[ 동물/캐릭터 ]</span> is <span class=\"slot\">[ 행동 ]</span> on the street!","ko":"[ 동물/캐릭터 ]가 거리에서 [ 행동 ]하고 있어요!","group":"s1-story-hint"}],"hints":[{"after":1,"group":"s1-object-hint","label":"오브젝트 단어 힌트","items":[["Building","건물"],["Car","자동차"],["Crosswalk","횡단보도"],["Tree","나무"]]},{"after":3,"group":"s1-story-hint","label":"동물 & 행동 세트 힌트","rows":[[["Giant pig","거대 돼지"],["Exploring","탐험하는 중"]],[["Lost puppy","길 잃은 강아지"],["Invading","침공하는 중"]],[["Cute cat","귀여운 고양이"],["Roaming","배회하는 중"]]]}]},"s2":{"title":"Real-world Problem Solving","subtitle":"돌발 상황 해결","missionEn":"Your student's program suddenly closes unexpectedly while drawing! Handle the situation calmly, guide them to open the recovery file, and save their work.","missionKo":"수업 도중 갑자기 학생의 프로그램이 꺼진 상황입니다. 아래 스크립트로 차분하게 복구 파일을 열고 작업 내용을 저장하도록 안내해 보세요.","messages":[{"role":"teacher","en":"Oh, no! It looks like your program closed unexpectedly. Don't worry, let's open it again.","ko":"어? 프로그램이 갑자기 꺼진 것 같네요. 걱정하지 말고 다시 열어봐요."},{"role":"student","en":"“Teacher, it asks if I want to restore the file. Should I click Yes?”","ko":"프로그램을 열며: 선생님, 파일을 복구할 거냐고 물어봐요. 'Yes'를 누를까요?","note":"Opens the program"},{"role":"teacher","en":"Yes, please click “Yes”! Now press Ctrl + S right away to save your work.","ko":"네, 'Yes'를 눌러요! 그리고 작업한 내용을 바로 저장하게 지금 Ctrl + S를 눌러주세요."},{"role":"student","en":"Okay, I saved it! Everything is safe now.","ko":"네, 저장했어요! 이제 다 안전하게 있어요."}]},"patterns":[{"tag":"INSTRUCTION","title":"Sending Objects Back/Forward","koTitle":"오브젝트 앞/뒤로 보내기","examples":[["Send the rectangle to the back so we can see the text.","텍스트가 보이도록 직사각형을 맨 뒤로 보내보세요."],["Send this small circle to the front so we can see the button detail.","단추 디테일이 보이도록 이 작은 원을 맨 앞으로 보내보세요."]],"quizKo":"캐릭터가 보이게 이 그림자를 뒤로 보내보세요.","answer":"Send this shadow to the back so we can see the character."},{"tag":"SHORTCUT","title":"Duplicating with Selection","koTitle":"선택하며 복제하기","examples":[["Duplicate this star shape by holding Ctrl and dragging it.","Ctrl을 누른 채로 드래그해서 이 별 모양을 복제해 보세요."],["Duplicate the chair by holding Cmd and dragging it on your Mac.","맥에서는 Cmd을 누른 채로 드래그해서 의자를 복제해 보세요."]],"quizKo":"Ctrl을 누른 채로 드래그해서 이 텍스트를 복제해 보세요.","answer":"Duplicate this text by holding Ctrl and dragging it."},{"tag":"GUIDE","title":"Combining Two Shapes","koTitle":"도형 합치기/연산","examples":[["Select both shapes and click the 'Add' button to combine them.","두 도형을 모두 선택하고 'Add' 버튼을 눌러서 합쳐보세요."],["Select both shapes and click the 'Subtract' button to cut out the front part.","두 도형을 모두 선택하고 'Subtract' 버튼을 눌러 앞쪽 부분을 잘라내 보세요."]],"quizKo":"두 도형을 모두 선택하고 'Divide' 버튼을 눌러서 조각으로 나눠보세요.","answer":"Select both shapes and click the 'Divide' button to separate them into pieces."},{"tag":"PRAISE","title":"Praising Neat Alignment","koTitle":"깔끔한 정렬 칭찬하기","examples":[["You aligned these shapes to the center, so the layout looks much more organized.","이 도형들을 가운데 정렬하니까 레이아웃이 훨씬 더 깔끔해 보이네요!"],["You aligned the text to the left, so the layout looks much more professional.","텍스트를 왼쪽 정렬하니까 레이아웃이 훨씬 더 전문적으로 보이네요!"]],"quizKo":"도형들을 정렬하니까 레이아웃이 완벽해 보이네요!","answer":"You aligned the shapes, so the layout looks perfect!"}]},"3":{"topic":"Bunny Cafe & Advanced Layer Control","terms":[["Layer Order","레이어 순서 (오브젝트가 겹쳐진 순서. 맨 뒤(Back)에서부터 맨 앞(Front)으로 쌓아 올리는 작업 방식)"],["Compound Shape","비파괴 도형 합치기 (Alt를 누른 채 도형을 합쳐, 외관은 하나지만 언제든 더블클릭하여 각 요소를 수정할 수 있는 기능)"],["Clipping Mask (Place Inside)","클리핑 마스크 (오브젝트를 잘라내어 대상 레이어 안으로 넣어 고정하는 마스킹 기능)"],["Low-Angle View","로우 앵글 시점 (아래에서 위를 올려다보는 시점. 아래쪽은 크게, 위쪽 멀리는 작게 보여 공간감을 강조)"],["Quick FX","빠른 효과 (Outer Glow, Gaussian Blur 등 오브젝트에 은은한 빛이나 흐림 효과를 빠르게 적용하는 스타일 패널)"]],"brainstormKo":"","s1":{"title":"“What does your bunny eat at the cafe?”","subtitle":"카페 속 토끼 음식 상상하기","messages":[{"role":"teacher","en":"Imagine our bunny is sitting in a cute cafe! What is your bunny drinking or eating right now?","ko":"우리 토끼가 귀여운 카페에 앉아 있다고 상상해 보세요! 지금 토끼가 무엇을 먹거나 마시고 있나요?"},{"role":"student","en":"My bunny is drinking <span class=\"slot\">[ 음료 ]</span> and eating <span class=\"slot\">[ 디저트/음식 ]</span>!","ko":"제 토끼는 [ 음료 ]를 마시고 [ 디저트/음식 ]을 먹고 있어요!","group":"s1-food-pair-hint"},{"role":"teacher","en":"Oh, wow! What a fun idea! What made you choose that?","ko":"와, 재미있는 아이디어네요! 왜 그걸 골랐나요?"},{"role":"student","en":"Because they’re my bunny's favorite! / Because they look so delicious!","ko":"토끼가 제일 좋아하는 음식이라서요! / 너무 맛있어 보여서요!"}],"hints":[{"after":1,"group":"s1-food-pair-hint","label":"디저트 & 음료 세트 힌트","rows":[[["Hot chocolate","핫초코"],["Carrot cake","당근 케이크"]],[["Cola/Coke","콜라"],["Hamburger / French fries","햄버거 / 감자튀김"]],[["Iced Matcha Latte","아이스 말차 라떼"],["Mint Chocolate Cookie","민트초코 쿠키"]]]}]},"s2":{"title":"Problem Solving","subtitle":"문제 해결","missionEn":"A student's layer order gets messy while drawing the bunny and background elements! Guide them calmly to send objects back or bring them forward using shortcuts.","missionKo":"토끼와 배경을 그리다가 레이어 순서가 꼬인 상황입니다. 단축키를 사용해 순서를 조정하도록 차분하게 안내해 보세요.","messages":[{"role":"teacher","en":"Oh, look! The bunny's body is in front of the table. Let's send it back using a shortcut!","ko":"어, 보세요! 토끼 몸통이 탁자 앞에 있네요. 단축키로 뒤로 보내봐요!"},{"role":"student","en":"How do I do that?","ko":"어떻게 하나요?"},{"role":"teacher","en":"Select the body, hold down Ctrl/Cmd, and press the left bracket [ key to send it back!","ko":"몸통을 선택하고 Ctrl/Cmd를 누른 채 왼쪽 대괄호 [ 를 눌러 뒤로 보내보세요!"},{"role":"student","en":"Wow, that's so easy! Now it looks natural!","ko":"와, 정말 쉽네요! 이제 자연스러워 보여요!"}]},"patterns":[{"tag":"","title":"Clipping Mask / Place Inside","koTitle":"클리핑 마스크 / 레이어 넣기","examples":[["Cut the stripe pattern, paste it above the T-shirt, and drag the layer to place it inside.","줄무늬 패턴을 잘라내서 티셔츠 레이어 위에 붙여넣은 뒤, 드래그해서 안으로 넣어보세요."]],"quizKo":"이 곡선을 잘라내고, 케이크 위에 붙여넣은 뒤 드래그해서 안으로 넣어보세요.","answer":"Cut this curve, paste it above the cake, and drag the layer to place it inside."},{"tag":"","title":"Stretching Handles with Node Tool","koTitle":"노드 핸들로 곡선 조절하기","examples":[["Click this node and stretch the handles outward a little to make a chubby face.","이 노드를 클릭하고 핸들을 바깥쪽으로 조금 늘려서 통통한 얼굴을 만들어 보세요."],["Click the top node and drag the handles to make the curve smoother.","위쪽 노드를 클릭하고 핸들을 드래그해서 곡선을 더 부드럽게 만들어 보세요."]],"quizKo":"노드를 클릭하고 핸들을 바깥쪽으로 늘려서 더 넓게 만들어 보세요.","answer":"Click the node and stretch the handles outward to make it wider."},{"tag":"","title":"Switching Between Move and Node Tools","koTitle":"이동 툴과 노드 툴 전환","examples":[["Press the letter V on your keyboard to go back to the Move tool.","키보드의 V를 눌러서 다시 이동 툴로 돌아가 보세요."]],"quizKo":"키보드의 A를 눌러서 노드 툴로 바꿔보세요.","answer":"Press the letter A on your keyboard to switch to the Node tool."},{"tag":"PRAISE","title":"Praising Creativity & Unique Styles","koTitle":"독창적인 상상력 칭찬하기","examples":[["I really love your unique idea of adding a hamburger and Coke for the bunny!","토끼에게 햄버거와 콜라를 들려준 독창적인 아이디어가 정말 좋네요!"],["I really love your creative idea of adding a bunny playing golf on the moon!","달에서 골프를 치는 토끼를 추가한 창의적인 아이디어가 정말 마음에 들어요!"]],"quizKo":"거리로 내려오는 헬리콥터를 추가한 창의적인 아이디어가 정말 좋습니다!","answer":"I really love your creative idea of adding a helicopter coming down onto the street."}]},"4":{"topic":"Cute Cat Character & Organic Vector Tools","terms":[["Transparency Tool (Y)","투명도 도구 (컬러 변화 없이 오브젝트에 투명도 그라데이션을 적용하여 부드러운 빛이나 그림자를 만드는 비파괴 도구)"],["Double Star Tool","더블 스타 툴 (안쪽/바깥쪽 노드 반경을 개별 조절할 수 있어 동물 캐릭터의 기본 몸통 형태를 잡기 유용한 도형 툴)"],["Convert to Smooth","곡선 노드 전환 (노드 툴 사용 중 뾰족한 앵커 포인트를 클릭 한 번으로 매끄러운 곡선 노드로 전환해 주는 기능)"],["Vector Blob Brush Tool","벡터 블롭 브러시 (드래그하는 대로 즉시 면 형태의 벡터 자국을 만들어 꼬리나 유기적인 형태를 그릴 때 유용한 도구)"]],"brainstormKo":"","s1":{"title":"“What is the most unique part of your cat?”","subtitle":"고양이 특징과 기분 상상하기","messages":[{"role":"teacher","en":"Look at your adorable cat! What is the most unique part of your cat?","ko":"귀여운 고양이를 보세요! 고양이의 가장 특별한 특징은 무엇인가요?"},{"role":"student","en":"My cat has <span class=\"slot\">[ 신체 특징/포인트 ]</span>","ko":"제 고양이는 [ 신체 특징/포인트 ]을/를 가지고 있어요!","group":"s1-cat-feature-hint"},{"role":"teacher","en":"Aww, that’s so cute! How is your cat feeling right now?","ko":"아, 정말 귀엽네요! 지금 고양이의 기분은 어떤가요?"},{"role":"student","en":"My cat is feeling <span class=\"slot\">[ 기분/상태 ]</span>!","ko":"제 고양이는 지금 [ 기분/상태 ]를 느끼고 있어요!","group":"s1-cat-feeling-hint"}],"hints":[{"after":1,"group":"s1-cat-feature-hint","label":"고양이 특징 단어 힌트","items":[["Big eyes","큰 눈"],["Long whiskers","긴 수염"],["A chubby body","통통한 몸"]]},{"after":3,"group":"s1-cat-feeling-hint","label":"고양이 기분 단어 힌트","items":[["Relaxed","느긋한"],["Surprised","놀란"],["Satisfied","만족스러운"]]}]},"s2":{"title":"Problem Solving","subtitle":"문제 해결","missionEn":"A student is struggling to close a shape because the pencil line won’t connect back to the start! Guide them calmly to turn on Auto-close and set it to 'Far' using the setting button.","missionKo":"연필 선 끝이 잘 닿지 않아 도형이 닫히지 않는 상황입니다. 설정에서 Auto-close를 켜고 'Far'로 맞추도록 차분하게 안내해 보세요.","messages":[{"role":"teacher","en":"Oh, look! The line isn't closing completely. Let's fix it in the settings!","ko":"어, 보세요! 선이 완전히 닫히지 않았네요. 설정에서 고쳐봐요!"},{"role":"student","en":"How can I close it?","ko":"어떻게 닫아야 하나요?"},{"role":"teacher","en":"Click the gear icon at the top, turn on Auto-close, and set it to 'Far'!","ko":"상단의 기어 아이콘을 누르고 Auto-close를 켠 뒤 'Far'로 설정해 보세요!"},{"role":"student","en":"Wow, now the shape closes so easily! Thank you!","ko":"와, 이제 도형이 정말 쉽게 닫히네요! 감사해요!"}]},"patterns":[{"tag":"","title":"Transparency Tool","koTitle":"투명도 그라데이션 적용하기","examples":[["Press the letter Y on your keyboard and drag from bottom to top to make it transparent.","키보드의 Y를 누르고 아래에서 위로 드래그해서 투명하게 만들어 보세요."],["Press the letter Y on your keyboard and drag from left to right to create a soft light effect.","키보드의 Y를 누르고 왼쪽에서 오른쪽으로 드래그해서 은은한 빛 효과를 만들어 보세요."]],"quizKo":"키보드의 Y를 누르고 위에서 아래로 드래그해서 부드러운 빛 효과를 만들어 보세요.","answer":"Press the letter Y on your keyboard and drag from top to bottom to create a soft light effect."},{"tag":"","title":"Converting Nodes to Smooth Curves","koTitle":"노드를 부드러운 곡선으로 전환하기","examples":[["Select the nodes with the Node tool and click the Convert to Smooth button to make the ears rounded.","노드 툴로 노드들을 선택하고 Convert to Smooth 버튼을 눌러 동글동글한 귀를 만들어 보세요."],["Select all the nodes and click the Convert to Smooth button to make the rock shape natural.","모든 노드를 선택하고 Convert to Smooth 버튼을 눌러 바위 모양을 자연스럽게 만들어 보세요."]],"quizKo":"노드 툴로 노드를 선택하고 Convert to Smooth 버튼을 눌러서 더 부드럽게 만들어 보세요.","answer":"Select the node with the Node tool and click the Convert to Smooth button to make it smoother."},{"tag":"","title":"Applying Path Brushes to Strokes","koTitle":"선에 브러시 적용하기","examples":[["Select the shape, choose the Dense Charcoal brush from the Dry Media category, and adjust the stroke width.","도형을 선택하고 Dry Media 카테고리에서 Dense Charcoal 브러시를 골라 스트로크 두께를 조절해 보세요."],["Select the whiskers, choose the Light Charcoal brush, and change the stroke color to black.","수염을 선택하고 Light Charcoal 브러시를 선택한 뒤 스트로크 색상을 검은색으로 바꿔 보세요."]],"quizKo":"도형을 선택하고 Dry Media 카테고리에서 파스텔 브러시를 선택한 뒤 두께를 조절해 보세요.","answer":"Select the shape, choose the Pastel brush from the Dry Media category, and adjust the stroke width."},{"tag":"PRAISE","title":"Praising Mood, Situation & Expressive Details","koTitle":"상황 표현 및 스타일 칭찬하기","examples":[["Great job expressing the relaxed mood of the cat lying on the floor!","바닥에 누워있는 고양이의 느긋한 분위기를 멋지게 잘 표현하셨네요!"],["I like how you expressed the surprised situation with that unique shadow!","독특한 그림자로 놀란 상황을 표현해낸 방식이 참 좋네요!"]],"quizKo":"빛 반사 효과로 바닷속 장면을 표현해낸 방식이 참 좋습니다!","answer":"I like how you expressed the underwater scene with light reflections!"}]},"5":{"topic":"Design a Cozy Room & Workspace Management","terms":[["Outer Shadow Effect (FX)","아우터 섀도 효과 (오브젝트 하단에 은은한 그림자 효과를 주어 입체감을 살리고, 바닥에 자연스럽게 떠 있거나 놓여 있는 듯한 '깊이감(Depth)'을 만드는 효과)"],["Studio Panel Preset","패널 프리셋 (패널 조작 중 레이어 패널이나 컬러 패널이 사라졌을 때, [Window] - [Panels] 메뉴를 통해 작업 공간을 초기화(Reset)하거나 나만의 패널 배치를 저장해두고 불러오는 공간 관리 기능)"]],"brainstormKo":"","s1":{"title":"Adding Props & Details","subtitle":"소품과 세부 요소로 분위기 연출하기","messages":[{"role":"teacher","en":"Look at your relaxing character! What props do you want to add to make it cozier?","ko":"편안해 보이는 캐릭터를 보세요! 더 아늑하게 만들기 위해 어떤 소품을 추가하고 싶나요?"},{"role":"student","en":"I want to add <span class=\"slot\">[ 소품 이름 ]</span> for my character!","ko":"제 캐릭터를 위해 [ 소품 이름 ]을/를 추가하고 싶어요!","group":"s1-prop-hint"},{"role":"teacher","en":"That’s a brilliant idea! Where are you going to put it, and what is your character doing?","ko":"멋진 아이디어네요! 어디에 두고, 캐릭터는 무엇을 하고 있나요?"},{"role":"student","en":"I'll put it <span class=\"slot\">[ 위치 ]</span>, and my character is <span class=\"slot\">[ -ing 행동 ]</span>!","ko":"[ 위치 ]에 두고, 제 캐릭터는 [ -ing 행동 ]을/를 하고 있을 거예요!","group":"s1-place-action-hint"}],"hints":[{"after":1,"group":"s1-prop-hint","label":"소품 단어 힌트","items":[["A side table","협탁"],["A remote control","리모컨"],["A floor lamp","장스탠드 조명"]]},{"after":3,"group":"s1-place-action-hint","label":"위치 & 행동 세트 힌트","rows":[[["next to the bed","침대 옆에"],["drinking hot chocolate","핫초코 마시기"]],[["on the sofa","소파 위에"],["watching Netflix","넷플릭스 보기"]],[["in the corner","구석에"],["enjoying organic chips","유기농 칩 먹기"]]]}]},"s2":{"title":"Problem Solving","subtitle":"패널이 사라졌거나 작업 공간이 어지러울 때","missionEn":"A student accidentally closed their Layers panel while drawing and got panicked! Guide them calmly to reset the panel workspace.","missionKo":"학생이 그림을 그리다가 실수로 레이어 패널을 닫고 당황한 상황입니다. 차분하게 패널 작업 공간을 초기화하도록 안내해 보세요.","messages":[{"role":"teacher","en":"Oh, where did your Layers panel go? Don't worry! Let's bring it back together.","ko":"어, 레이어 패널이 어디로 갔을까요? 걱정하지 마세요! 같이 다시 불러와 봐요."},{"role":"student","en":"I accidentally closed it! How can I see my layers again?","ko":"실수로 닫아버렸어요! 어떻게 해야 레이어 패널을 다시 볼 수 있나요?"},{"role":"teacher","en":"Click Window at the top, go to Panels, and click Reset! It resets all the panels right away.","ko":"상단의 Window를 누르고 Panels로 가서 Reset을 눌러보세요! 모든 패널이 바로 초기화돼요."},{"role":"student","en":"Wow, my Layers panel is back! Thank you, Teacher!","ko":"와, 레이어 패널이 다시 돌아왔어요! 감사해요, 선생님!"}]},"patterns":[{"tag":"GUIDE","title":"Subtract Tool","koTitle":"도형 잘라내어 새 모양 만들기","examples":[["Overlap the two shapes, select them together, and click the Subtract button to make a donut shape.","두 도형을 겹쳐놓고 함께 선택한 뒤, Subtract 버튼을 눌러 도넛 모양을 만들어 보세요."],["Select the two shapes together and click the Subtract button to delete the unnecessary part.","두 도형을 함께 선택하고 Subtract 버튼을 눌러 불필요한 부분을 잘라내 보세요."]],"quizKo":"두 도형을 겹쳐놓고 함께 선택한 뒤, Subtract 버튼을 눌러 열쇠구멍 모양을 만들어 보세요.","answer":"Overlap the two shapes, select them together, and click the Subtract button to make a keyhole shape."},{"tag":"GUIDE","title":"Compound Shapes","koTitle":"비파괴 합성으로 수정 가능한 도형 만들기","examples":[["Hold the Alt key and click the Add button so you can edit each shape later.","Alt 키를 누른 채 Add 버튼을 눌러 나중에도 각 도형을 수정할 수 있게 합쳐 보세요."],["Hold the Alt key and click the Add button to make a compound shape for the logo.","Alt 키를 누른 채 Add 버튼을 눌러 로고를 위한 Compound 도형을 만들어 보세요."]],"quizKo":"Alt 키를 누른 채 Add 버튼을 눌러 이 도형들을 합쳐 보세요.","answer":"Hold the Alt key and click the Add button to combine these shapes."},{"tag":"GUIDE","title":"Saving Panel Layout Presets","koTitle":"패널 배치 나만의 프리셋으로 저장하기","examples":[["Go to Panels, click Add Preset, and type ‘reset’ to save your current layout.","Panels로 가서 Add Preset을 누르고 ‘reset’을 입력해 현재 배치를 저장해 보세요."],["Go to Panels and click Add Preset so you can go back to this setup anytime.","Panels로 가서 Add Preset을 눌러 언제든 이 설정으로 돌아올 수 있게 저장해 보세요."]],"quizKo":"Panels로 가서 Add Preset을 누르고 이름을 입력해 배치를 저장해 보세요.","answer":"Go to Panels, click Add Preset, and type your name to save your layout."},{"tag":"PRAISE","title":"Complimenting Atmosphere & Creative Details","koTitle":"분위기 연출 및 세부 요소 칭찬하기","examples":[["It’s so impressive how you used the Netflix and YouTube buttons to capture the cozy weekend vibe!","넷플릭스와 유튜브 버튼을 활용해서 아늑한 주말 분위기를 멋지게 살려낸 점이 정말 인상적이에요!"],["It’s so impressive how you used small props to capture the relaxing atmosphere of your character!","작은 소품들을 활용해서 캐릭터의 느긋하고 편안한 분위기를 멋지게 살려낸 점이 정말 인상적이에요!"]],"quizKo":"여러 가지 버튼을 활용해서 실제 리모컨 느낌을 멋지게 살려낸 점이 정말 인상적이에요!","answer":"It’s so impressive how you used various buttons to capture the real remote control vibe!"}]},"6":{"topic":"Design a Space Scene & Technical Troubleshooting","terms":[["Vector Crop Tool","비파괴 자르기 도구 (이미지를 자르는 일반 Crop Tool과 달리, 도형이나 레이어의 특정 영역만 비파괴 방식으로 가려서 원하는 부분만 남기는 모듈형 자르기 도구. 맨 위 원의 아래쪽을 잘라내어 고리가 행성을 입체적으로 감싸는 듯한 효과를 연출할 때 사용)"],["Break Curve (Node Disconnect)","노드 분리 기능 (노드 툴 사용 중 선택한 앵커 포인트를 분리하여 닫힌 패스를 열린 선으로 끊어내거나, 필요 없는 선 부분만 선택해 삭제할 수 있게 해주는 기능. 캐릭터 패스를 정리하거나 불필요한 선을 잘라낼 때 사용)"]],"brainstormKo":"","s1":{"title":"Character's Feelings & Story","subtitle":"캐릭터의 기분과 사연 이야기하기","messages":[{"role":"teacher","en":"Look at your character on the planet! How do you think your character is feeling?","ko":"행성 위에 있는 캐릭터를 보세요! 캐릭터가 어떤 기분을 느끼고 있는 것 같나요?"},{"role":"student","en":"My character is feeling <span class=\"slot\">[ 기분 ]</span> because <span class=\"slot\">[ 사연 ]</span>!","ko":"제 캐릭터는 [ 사연 ]해서 [ 기분 ]을 느끼고 있어요!","group":"s1-feeling-story-hint"},{"role":"teacher","en":"Oh really? What is it doing right now?","ko":"아 정말요? 지금 거기서 무엇을 하고 있나요?"},{"role":"student","en":"It is <span class=\"slot\">[ 행동 ]</span>!","ko":"지금 [ 행동 ]을/를 하고 있어요!","group":"s1-action-hint"}],"hints":[{"after":1,"group":"s1-feeling-story-hint","label":"캐릭터 기분 & 사연 세트 힌트","rows":[[["upset","속상한"],["he failed an exam","시험을 망쳐서"]],[["worried","걱정하는"],["he flew off the screen","화면 밖으로 튕겨 나가서"]],[["excited","신이 난"],["she was the first to land on the moon","달에 1등으로 착륙해서"]]]},{"after":3,"group":"s1-action-hint","label":"행동 단어 힌트","items":[["crying in the corner","구석에서 울고 있는"],["trying to come back","다시 돌아오려고 애쓰는"],["planting a flag","깃발을 꽂고 있는"]]}]},"s2":{"title":"Problem Solving","subtitle":"아트보드를 놓쳐 화면이 확대되었을 때","missionEn":"A student can't find their artboard after zooming in too much! Guide them to reset the artboard view.","missionKo":"학생이 너무 확대해서 아트보드를 놓친 상황입니다. 아트보드 화면을 다시 맞추도록 안내해 보세요.","messages":[{"role":"teacher","en":"Oh, did your artboard disappear? Don’t worry! Let’s fit it back to the screen.","ko":"어라, 아트보드가 사라졌나요? 걱정하지 마세요! 다시 화면 크기에 맞게 맞춰 봐요."},{"role":"student","en":"I zoomed in too much! How can I see my whole space scene again?","ko":"너무 확대했어요! 전체 우주 풍경을 다시 어떻게 보나요?"},{"role":"teacher","en":"Press Control and zero together on your keyboard! That will fit the whole artboard to your screen.","ko":"키보드에서 Control과 0을 함께 눌러보세요! 아트보드가 화면 크기에 딱 맞춰 돌아올 거예요."},{"role":"student","en":"Aha! I can see my whole space scene again. Thank you, Teacher!","ko":"아하! 이제 전체 우주 풍경이 다시 보여요. 감사해요, 선생님!"}]},"patterns":[{"tag":"GUIDE","title":"Making Ring Planets with Vector Crop","koTitle":"Vector Crop으로 고리 행성 만들기","examples":[["Draw a circle, add a ring, and put another circle on top.","원을 그리고, 고리를 얹은 뒤, 그 위에 또 다른 원을 올려보세요."],["Crop the bottom of the top circle to show the ring.","맨 위 원의 아래를 잘라서 고리가 보이게 해보세요."]]},{"tag":"GUIDE","title":"Adding Texture using Place Inside","koTitle":"Place Inside로 행성에 텍스처 넣기","examples":[["Draw some crater patterns, group them together, and drag the group inside the moon layer.","크레이터 패턴을 그리고 그룹으로 묶은 다음, 그 그룹을 달 레이어 안으로 드래그해 넣어보세요."],["If you drag your stripe patterns inside the circle layer, they will clip perfectly to the planet shape.","줄무늬 패턴을 원 레이어 안으로 드래그하면 행성 모양에 맞춰 깔끔하게 잘려 들어갑니다."]],"quizKo":"텍스처 레이어를 원 레이어 안으로 드래그해서 넣어보세요.","answer":"Drag the texture layer inside the circle layer."},{"tag":"SHORTCUT","title":"Grouping & Ungrouping","koTitle":"그룹 지정 및 해제 단축키","examples":[["Select all the glowing stars and press Control + G so you can move them all at once.","빛나는 별들을 모두 선택하고 Control + G를 누르면 한 번에 같이 움직일 수 있어요."],["If you want to change the color of just one character, press Control + Shift + G to ungroup the characters first.","캐릭터 하나만 색상을 바꾸고 싶다면, 먼저 Control + Shift + G를 눌러 캐릭터들의 그룹을 해제해 주세요."]],"quizKo":"Control + Shift + G를 눌러 그룹을 해제해 보세요.","answer":"Press Control + Shift + G to ungroup them."},{"tag":"SHARING STORY","title":"Inviting Students to Share Their Work","koTitle":"작품 스토리 발표 및 공유 유도하기","examples":[["Before we wrap up, can you show us your artwork and tell us what's happening in your space scene?","수업을 마치기 전에, 여러분의 작품을 보여주며 우주 장면에서 무슨 일이 벌어지고 있는지 이야기해 줄 수 있나요?"]],"quizKo":"오늘 수업을 마무리하기 전에, 여러분이 만든 작품에 대해 이야기해 줄 수 있나요?","answer":"Before we wrap up today's class, can you show us your artwork and tell us about it?"}]},"7":{"topic":"Strawberry Cake Design & Layer Effects","terms":[["Offset Tool (in Outer Shadow)","그림자 위치 조절 도구 (Quick Effects의 Outer Shadow 내에 있는 도구로, 마우스 드래그를 통해 그림자의 위치와 방향을 직관적으로 이동 및 조절하는 기능. 테이블이나 접시 밑에 입체적인 그림자를 넣을 때 사용)"],["Dashed Line (Stroke Panel)","점선 스타일 기능 (Stroke Panel의 선 스타일 중 하나로, Dash(선 길이)와 Gap(선 간격) 수치를 조절하여 점선 테두리나 패턴을 만드는 기능. 접시의 테두리 패턴을 연출할 때 사용)"],["Noise Effect","질감 표현 효과 (Color Panel의 Opacity 아래 작은 원을 클릭하여 적용하는 효과로, 단색 면에 입자감을 더해 케이크 빵의 포슬포슬한 질감을 표현하는 기능)"]],"brainstormKo":"","s1":{"title":"Ice-breaking & Favorite Cake","subtitle":"좋아하는 케이크 물어보기","messages":[{"role":"teacher","en":"Do you like strawberry cake? What is your favorite cake?","ko":"딸기 케이크 좋아하나요? 아니면 어떤 케이크를 가장 좋아하나요?"},{"role":"student","en":"I like <span class=\"slot\">[ 케이크 종류 ]</span> because <span class=\"slot\">[ 이유 ]</span>!","ko":"저는 [ 케이크 종류 ]를 좋아해요. [ 이유 ]하기 때문이에요!","group":"s1-cake-reason-hint"},{"role":"teacher","en":"Oh, really? That sounds delicious! Today, we're going to design a yummy strawberry cake.","ko":"아 정말요? 정말 맛있겠네요! 오늘은 맛있는 딸기 케이크를 만들어 볼 거예요."}],"hints":[{"after":1,"group":"s1-cake-reason-hint","label":"케이크 종류 & 이유 세트 힌트","rows":[[["strawberry cake","딸기 케이크"],["it's sweet and refreshing","달콤하고 상큼해서"]],[["chocolate cake","초콜릿 케이크"],["I love rich chocolate flavor","진한 초콜릿 맛을 좋아해서"]],[["ice cream cake","아이스크림 케이크"],["it's cold and soft","차갑고 부드러워서"]]]}]},"s2":{"title":"Exporting Artwork as an Image","subtitle":"작품 이미지로 내보내기 및 공유하기","missionEn":"A student finished their artwork! Guide them to export their work as an image file and share it in the chat.","missionKo":"학생이 작품을 완성한 상황입니다. 작품을 이미지 파일로 내보내고 채팅창에 공유하도록 안내해 보세요.","messages":[{"role":"teacher","en":"Wow, your cake looks amazing! Let's export your artwork as an image file.","ko":"와, 케이크가 정말 멋지네요! 여러분의 작품을 이미지 파일로 내보내 볼까요?"},{"role":"student","en":"Sure! How can I save it as an image?","ko":"좋아요! 어떻게 이미지로 저장하나요?"},{"role":"teacher","en":"Click File at the top, select Export, and save it as a PNG file! Then, share it in the chat box.","ko":"상단에서 File을 누르고, Export를 선택한 뒤 PNG 파일로 저장하세요! 그러고 나서 채팅창에 공유하면 됩니다."},{"role":"student","en":"I exported and shared my picture! Did you get it?","ko":"내보내기 해서 사진을 공유했어요! 받으셨나요?"}]},"patterns":[{"tag":"GUIDE","title":"Showing the Table's Thickness & Filling the Gap","koTitle":"테이블 두께 표현 및 빈틈 메우기","examples":[["Overlap two ellipses to show the thickness of the table.","두 개의 타원을 겹쳐서 테이블의 두께감을 표현해 보세요."],["Change the top ellipse to a lighter color to create a realistic look.","상단 타원을 더 밝은 색으로 바꿔서 입체적이고 자연스럽게 표현해 보세요."]],"quizKo":"두 타원 사이의 빈틈을 작은 사각형으로 메워보세요.","answer":"Draw a small rectangle to fill the gap between the two ellipses."},{"tag":"GUIDE","title":"Adding Shadow with Offset Tool","koTitle":"Offset Tool로 그림자 넣기","examples":[["Click Quick Effects, turn on Outer Shadow, and use the Offset Tool to drag the shadow.","Quick Effects를 클릭하고 Outer Shadow를 켠 다음, Offset Tool로 그림자를 드래그해 보세요."],["Lower the opacity slider to make the shadow softer and more natural.","불투명도 슬라이더를 내려서 그림자를 더 부드럽고 자연스럽게 만들어 보세요."]],"quizKo":"Outer Shadow의 Offset Tool을 사용해서 그림자를 이동시켜 보세요.","answer":"Use the Offset Tool in Outer Shadow to move the shadow."},{"tag":"GUIDE","title":"Creating Plate Pattern with Dashed Line","koTitle":"점선으로 접시 패턴 만들기","examples":[["Switch to the dashed line option on the Stroke panel to make a plate pattern.","Stroke 패널에서 점선 옵션으로 바꿔서 접시 패턴을 만들어 보세요."],["The first box controls the dash length, and the second box controls the gap between them.","첫 번째 상자는 점선의 길이를 조절하고, 두 번째 상자는 간격을 조절합니다."]],"quizKo":"Stroke 패널에서 첫 번째 숫자를 올려서 점선 길이를 늘려보세요.","answer":"Increase the first number in the Stroke panel to make longer dashes."},{"tag":"GUIDE","title":"Adding Noise Effect on Texture","koTitle":"노이즈 질감 표현하기","examples":[["Click the small circle below the color wheel to switch to the Noise slider.","컬러 휠 아래의 작은 원을 클릭하여 노이즈 슬라이더로 전환해 보세요."],["Drag the slider to add a soft noise texture to your cake layer.","슬라이더를 드래그해서 케이크 레이어에 포슬포슬한 노이즈 질감을 넣어보세요."]],"quizKo":"노이즈 슬라이더를 드래그해서 모래에 질감을 넣어보세요.","answer":"Drag the noise slider to add texture to the sand."}]},"8":{"topic":"Road & Building Layout Planning Scene Creation","terms":[["Corner Tool (C)","코너 툴 (사각형 등 직각 노드를 클릭하고 안쪽으로 드래그하여 아치형 문이나 라운드 창문처럼 부드러운 곡선 코너로 전환하는 도구)"],["New Warp Group (Perspective)","벡터 워프 그룹 (오브젝트나 그룹 전체에 4개의 제어점을 생성하여 자유롭게 이끌어 당김으로써 원근감과 입체적인 입면 왜곡을 만드는 기능)"]],"brainstormKo":"","s1":{"title":"Storytelling & Scene Planning","subtitle":"장면과 스토리 연출하기","messages":[{"role":"teacher","en":"Look at your amazing street scene! Who are your main characters, and what are they doing here?","ko":"멋진 거리 장면을 보세요! 메인 캐릭터들은 누구이고, 여기서 무엇을 하고 있나요?"},{"role":"student","en":"My characters are <span class=\"slot\">[ 캐릭터들 ]</span>, and they are <span class=\"slot\">[ 행동/상황 ]</span>!","ko":"제 캐릭터들은 [ 캐릭터들 ]이고, 지금 [ 행동/상황 ]을/를 하고 있어요!","group":"s1-character-action-hint"},{"role":"teacher","en":"That sounds so interesting! Why are they doing that?","ko":"정말 흥미롭네요! 왜 그러고 있나요?"},{"role":"student","en":"They are <span class=\"slot\">[ 행동/상황 ]</span> because <span class=\"slot\">[ 이유/원인 ]</span>!","ko":"[ 이유/원인 ] 때문에 지금 [ 행동/상황 ]을/를 하고 있어요!","group":"s1-action-reason-hint"}],"hints":[{"after":1,"group":"s1-character-action-hint","label":"캐릭터 & 행동 세트 힌트","rows":[[["Two rabbits","토끼 두 마리"],["Shopping for food","장보기를 하는 중인"]],[["Two friends","두 친구"],["Arguing on the street","거리에서 다투는 중인"]],[["Three pigs","돼지 세 마리"],["Exploring the city","도시를 탐험하는 중인"]]]},{"after":3,"group":"s1-action-reason-hint","label":"행동 & 이유 세트 힌트","rows":[[["Shopping for food","장보기를 하는 중인"],["They are hungry","배가 고파서"]],[["Arguing on the street","거리에서 다투는 중인"],["They dropped their ice cream","아이스크림을 떨어뜨려서"]],[["Exploring the city","도시를 탐험하는 중인"],["They want to build a house","집을 짓고 싶어서"]]]}]},"s2":{"title":"Problem Solving","subtitle":"작업 화면이 사라졌거나 선택이 안 될 때","missionEn":"A student accidentally pressed the Tab key, and all the tools and panels disappeared! Guide them calmly to bring back the UI workspace.","missionKo":"학생이 실수로 Tab 키를 눌러 모든 도구와 패널이 사라지고 당황한 상황입니다. 차분하게 Tab 키를 다시 눌러 화면을 복구하도록 안내해 보세요.","messages":[{"role":"teacher","en":"Oh, did all your tools and panels disappear? Don't panic! Let's bring them back.","ko":"어, 모든 도구와 패널이 사라졌나요? 당황하지 마세요! 다시 불러와 봐요."},{"role":"student","en":"Yes! Everything is gone! How can I see my tools again?","ko":"네! 모두 사라졌어요! 어떻게 해야 도구들을 다시 볼 수 있나요?"},{"role":"teacher","en":"Press the Tab key on your keyboard! It brings back all the toolbars and panels right away.","ko":"키보드의 Tab 키를 눌러보세요! 모든 툴바와 패널이 바로 다시 돌아올 거예요."},{"role":"student","en":"Wow, my tools are back! Thank you, Teacher!","ko":"와, 도구들이 다시 돌아왔어요! 감사해요, 선생님!"}]},"patterns":[{"tag":"GUIDE","title":"Duplicating with Constant Spacing","koTitle":"같은 간격으로 연속 복제하기","examples":[["Hold Ctrl and drag to copy the circle to the right, then press Ctrl + J to keep the same spacing.","Ctrl을 누른 채 드래그하여 원을 오른쪽으로 복사한 뒤, Ctrl + J를 눌러 동일한 간격을 유지해 보세요."],["Hold Ctrl, drag to copy one shape, and press Ctrl + J to repeat the step automatically.","Ctrl을 누른 채 드래그하여 모양 하나를 복제하고, Ctrl + J를 눌러 동일한 작업을 자동 반복해 보세요."]],"quizKo":"Ctrl을 누른 채 도로 선을 오른쪽으로 복사한 뒤, Ctrl + J를 눌러 같은 간격으로 복제해 보세요.","answer":"Hold Ctrl and drag to copy the road line to the right, then press Ctrl + J to duplicate it with the same spacing."},{"tag":"GUIDE","title":"Rounding Corners","koTitle":"코너 툴로 아치 모양 만들기","examples":[["Press the letter C to choose the Corner tool, select the top two nodes, and drag inward to make a rounded door.","단축키 C를 눌러 코너 툴을 선택하고, 상단 노드 두 개를 선택한 뒤 안쪽으로 드래그하여 아치형 문을 만들어 보세요."],["Select the corners with the Corner tool and drag them to create a smooth window shape.","코너 툴로 모서리들을 선택하고 드래그하여 부드러운 창문 형태를 만들어 보세요."]],"quizKo":"단축키 C를 누르고 상단 모서리를 안쪽으로 드래그해서 동그란 문을 만들어 보세요.","answer":"Press the letter C and drag the top corners inward to make a rounded door."},{"tag":"GUIDE","title":"Applying Perspective Warp","koTitle":"New Warp Group으로 원근감 적용하기","examples":[["Select the door group, go to Vector on the top menu, and click New Warp Group to apply Perspective.","문 그룹을 선택하고 상단 메뉴의 Vector로 가서 New Warp Group을 클릭해 원근감을 적용해 보세요."],["Click New Warp Group, choose Perspective, and drag the four corner points to match the building angle.","New Warp Group을 클릭하고 Perspective를 선택한 뒤, 네 개의 코너 포인트를 드래그하여 건물 각도에 맞춰 보세요."]],"quizKo":"상단 메뉴의 Vector로 가서 New Warp Group을 누르고 원근감을 표현해 보세요.","answer":"Go to Vector on the top menu, click New Warp Group, and express the perspective."},{"tag":"PRAISE","title":"Complimenting Creative Storytelling & Depth","koTitle":"스토리 연출 및 입체감 표현 칭찬하기","examples":[["I’m so amazed by how you expressed realistic depth using the Warp Group!","워프 그룹을 사용해서 입체적인 깊이감을 멋지게 표현해낸 것에 정말 놀랐어요!"],["You have such a wonderful imagination, and your creative details make the story come alive!","상상력이 정말 뛰어나고, 독창적인 세부 요소 덕분에 이야기가 멋지게 살아 숨 쉬는 것 같아요!"]],"quizKo":"헤드라이트에 디테일을 더해서 자동차를 정말 사실적으로 표현해낸 점이 인상적이에요!","answer":"I'm so impressed by how you added details to the headlights to make the car look so realistic!"}]},"9":{"topic":"Room Interior Scene & Object Placement","terms":[["Shift + X (Switch Fill/Stroke)","면/선 색상 전환 (면 색상과 선 색상을 단축키 하나로 서로 빠르게 맞바꿔 작업 속도를 높이는 기능)"],["Cloud / Star Tool (Bubble & Point)","구름/별 모양 도구 (버블이나 포인트 개수를 조절하여 꽃잎이나 정교한 캐릭터 형태를 손쉽게 만드는 기능)"]],"brainstormKo":"","s1":{"title":"Storytelling & Character Placement","subtitle":"캐릭터 연출 및 컨셉 이야기하기","messages":[{"role":"teacher","en":"Look at all these details! Did you draw all of these characters yourself?","ko":"이 섬세한 디테일들을 보세요! 이 캐릭터들을 직접 다 그린 건가요?"},{"role":"student","en":"Yes! My character is <span class=\"slot\">[ 캐릭터 ]</span>, and <span class=\"slot\">[ he / she / it ]</span> is <span class=\"slot\">[ 행동 / 상황 ]</span>!","ko":"네! 제 캐릭터는 [ 캐릭터 ]이고, 지금 [ 행동 / 상황 ]을/를 하고 있어요!","group":"s1-hint"},{"role":"teacher","en":"Wow, that's amazing! You did such a fantastic job. I'm so excited to see your book come to life!","ko":"와, 정말 대단해요! 정말 멋지게 잘해냈어요. 이 그림책이나 만화가 완성될 모습이 정말 기대돼요!"}],"hint":{"after":1,"group":"s1-hint","label":"캐릭터 & 상황 단어 힌트","rows":[[["A pink monkey","분홍색 원숭이"],["Holding a whisk","거품기를 든"]],[["A sleepy king","졸린 왕"],["Reading a book","책을 읽는"]],[["A cute robot","로봇"],["Cleaning the room","방을 청소하는"]]]}},"s2":{"title":"Selecting an Item Inside a Group","subtitle":"그룹 안의 개별 오브젝트 바로 선택하기","missionEn":"Guide the student to use Ctrl + Click to edit an item inside a group without ungrouping.","missionKo":"그룹을 해제하지 않고 Ctrl + 클릭으로 그룹 내부의 특정 아이템만 바로 선택하여 수정하도록 안내해 보세요.","messages":[{"role":"teacher","en":"Do you want to edit just that small item inside the group? You don't need to ungroup everything!","ko":"그룹 안에 있는 저 작은 아이템만 수정하고 싶나요? 그룹을 전부 해제할 필요 없어요!"},{"role":"student","en":"Really? How can I select just one item inside the group?","ko":"정말요? 그룹 안에 있는 아이템 하나만 어떻게 선택할 수 있나요?"},{"role":"teacher","en":"Hold down the Ctrl key and click on that item. You can select it directly inside the group!","ko":"Ctrl 키를 누른 채로 그 아이템을 클릭해 보세요. 그룹 안에서 해당 오브젝트만 바로 선택할 수 있어요!"},{"role":"student","en":"Wow, I don't have to ungroup it every time! That's so convenient!","ko":"와, 매번 그룹을 해제하지 않아도 되네요! 정말 편해요!"}]},"patterns":[{"tag":"GUIDE","title":"Switching Fill and Stroke","koTitle":"Shift + X로 면/선 색상 빠르게 바꾸기","examples":[["Press Shift + X to switch the fill color and stroke color instantly.","Shift + X를 눌러 면 색상과 선 색상을 즉시 맞바꿔 보세요."],["Set the fill color to none and press Shift + X to apply a clean brown stroke to the frame.","면 색상을 '없음'으로 설정하고 Shift + X를 눌러 프레임에 깔끔한 갈색 테두리 선을 적용해 보세요."]],"quizKo":"Shift + X를 눌러서 면 색상과 선 색상을 서로 바꿔 보세요.","answer":"Press Shift + X to switch the fill and stroke colors."},{"tag":"GUIDE","title":"Applying Outer Shadow Effect","koTitle":"Outer Shadow로 액자 그림자 표현하기","examples":[["Go to Quick Effects, select Outer Shadow, and adjust the offset slider to create a natural shadow.","Quick Effects로 가서 Outer Shadow를 선택하고 Offset 슬라이더를 조절해 자연스러운 그림자를 만들어 보세요."],["You can adjust the opacity and radius to give the picture frame depth and dimension.","불투명도와 반경을 조절하여 액자에 깊이감과 입체감을 표현할 수 있습니다."]],"quizKo":"Quick Effects에서 Outer Shadow를 선택하고 Offset 값을 조절해 보세요.","answer":"Go to Quick Effects, select Outer Shadow, and adjust the offset value."},{"tag":"GUIDE","title":"Making Flower Petals with Shape Tools","koTitle":"도형 툴 포인트 조절로 꽃잎 연출하기","examples":[["Select the Cloud tool or Star tool and change the number of bubbles or points to four or five to make petals.","구름 툴이나 별 툴을 선택하고 버블이나 포인트 숫자를 4개 또는 5개로 바꿔 꽃잎을 만들어 보세요."],["Use the Tear tool for the leaf, add a node using the Node tool, and bend the line slightly to make a vein.","나뭇잎에는 눈물방울 툴을 사용하고, 노드 툴로 점을 추가한 뒤 선을 살짝 구부려 잎맥을 만들어 보세요."]],"quizKo":"구름 툴을 선택하고 버블 숫자를 5로 바꿔서 꽃잎 모양을 만들어 보세요.","answer":"Select the Cloud tool and change the number of bubbles to 5 to make a petal shape."},{"tag":"GUIDE","title":"Creating a Thick Book with Pen & Node Tools","koTitle":"펜 툴과 노드 툴로 입체 양장본 책 연출하기","examples":[["Draw the outer cover using the Pen tool, then add extra nodes to give the book a realistic thickness.","펜 툴로 커버 외곽을 그린 뒤, 노드를 추가하여 책에 입체적인 두께감을 부여해 보세요."],["Duplicate the cover shape, choose a lighter color for the inner pages, and bend the lines using the Node tool.","커버 모양을 복제하고 안쪽 페이지에는 더 밝은 색을 지정한 후, 노드 툴로 선을 구부려 보세요."]],"quizKo":"노드 툴로 점을 클릭해서 선을 살짝 구부려 펼쳐진 책 모양을 만들어 보세요.","answer":"Click a node with the Node tool and bend the line slightly to make an open book shape."}]},"10":{"topic":"Low Angle Perspective & Shape Builder","terms":[["Trapezoid Control & Center Scaling ('Ctrl + Drag Red Points')","사다리꼴 대칭 조절 (사다리꼴 도형 더블클릭 후 'Ctrl' 키를 누른 채 빨간 점 조절점을 드래그하여 양쪽 길이를 동시에 대칭으로 줄이거나 늘려 로우앵글 입체감을 연출하는 기능)"],["Shape Builder Tool ('S Key' + 'Alt Key')","도형 통합 및 차감 (선택한 개체에서 'S' 키로 Shape Builder를 실행한 뒤 'Alt' 키를 누른 채 클릭/드래그하여 불필요하게 넘친 하단 영역을 즉시 잘라내어 평평하게 만드는 기능)"]],"brainstormKo":"","s1":{"title":"Choosing Low-Angle Characters & Poses","subtitle":"로우앵글 빌딩과 캐릭터 선택하기","messages":[{"role":"teacher","en":"Look at these low-angle building references! Which character do you want to draw today?","ko":"이 로우앵글 건물 레퍼런스들을 보세요! 오늘 어떤 캐릭터를 그려보고 싶나요?"},{"role":"student","en":"I want to draw <span class=\"slot\">[ 캐릭터/동물 ]</span> <span class=\"slot\">[ 동작/상황 ]</span> onto this building!","ko":"네! 저는 이 건물에 [ 동작/상황 ] 하는 [ 캐릭터/동물 ]을 그려보고 싶어요!","group":"s1-low-angle-hint"},{"role":"teacher","en":"Awesome choice! Let's build the background first and add your character in!","ko":"멋진 선택이에요! 먼저 건물 배경을 다듬고 캐릭터를 넣어봅시다!"}],"hints":[{"after":1,"group":"s1-low-angle-hint","label":"구도 & 캐릭터 세트 힌트","rows":[[["Spider-Man","스파이더맨"],["hanging onto the building","건물에 매달린"]],[["Bunny","토끼"],["coming down with a parachute","낙하산을 타고 내려오는"]],[["Girl","소녀"],["holding an umbrella","우산을 든"]]]}]},"s2":{"title":"Checking Last Class's Artwork & Details","subtitle":"지난 시간 작품 완성도 및 캐릭터 피드백","messages":[{"role":"teacher","en":"Did you finish your work from last time by adding characters?","ko":"지난 시간 작품에 캐릭터 추가해서 완성해 봤나요?"},{"role":"student","en":"Yes! I added a baking monkey with butter, eggs, and pink curtains in my picture!","ko":"네! 저는 제 그림에 버터랑 계란, 핑크 커튼을 넣은 빵 굽는 원숭이를 추가했어요!"},{"role":"teacher","en":"Wow, I really love your cute details like the whipped cream! Can you capture it and upload it on our meeting chat?","ko":"와, 휘핑크림 같은 아기자기한 디테일이 정말 마음에 드네요! 캡처해서 회의 채팅창에 올려줄 수 있나요?"}]},"patterns":[{"tag":"GUIDE","title":"Symmetrically Scaling Trapezoid Handles with Ctrl ('Double-Click Trapezoid' + 'Ctrl + Drag')","koTitle":"Ctrl 키로 사다리꼴 조절점 대칭 변형하기","examples":[["Double-click the trapezoid, hold the Ctrl key, and drag the red handle to adjust both sides equally.","사다리꼴을 더블클릭한 후 Ctrl 키를 누른 채 빨간 조절점을 드래그하여 양쪽을 대칭으로 조절해 보세요."],["Holding the Ctrl key keeps the center aligned while you narrow the top width for a low-angle view.","Ctrl 키를 누른 채 작업하면 건물의 상단 너비를 줄일 때 개체의 중앙 축이 고정됩니다."]],"quizKo":"사다리꼴을 더블클릭하고 Ctrl 키를 누른 채 빨간 점을 움직여 중심을 맞추며 줄여보세요.","answer":"Double-click the trapezoid, hold Ctrl, and drag the red dot to adjust both sides."},{"tag":"GUIDE","title":"Trimming Bottom Shapes with Shape Builder ('S Key' + 'Alt + Click')","koTitle":"Shape Builder와 Alt 키로 불필요한 영역 잘라내기","examples":[["Select all overlapping shapes, press S to open Shape Builder, and hold Alt to delete bottom parts.","겹쳐진 도형들을 모두 선택하고 S를 눌러 Shape Builder를 연 뒤 Alt 키를 누른 채 아래쪽 부분을 지워 보세요."],["Holding Alt subtracts unnecessary shape intersections instantly to create a flat cloud base.","Alt 키를 누르고 드래그하면 겹친 불필요한 영역을 즉시 차감하여 구름의 아래쪽을 평평하게 정돈해 줍니다."]],"quizKo":"모든 도형을 선택하고 S를 누른 후 Alt 키를 누른 채 클릭하여 아래쪽을 지워 보세요.","answer":"Select all shapes, press S, and hold Alt while clicking to trim the extra bottom parts."},{"tag":"GUIDE","title":"Clipping Detail Lines into Character Shapes ('Drag Layer onto Ellipse')","koTitle":"라인 레이어를 캐릭터 얼굴 도형 안으로 클리핑하기","examples":[["Select the line detail layers and drag them directly onto the face ellipse layer to clip them inside.","라인 세부 레이어들을 선택하여 얼굴 원형 레이어 안으로 드래그해 선들을 내부로 쏙 넣어 보세요."],["Dragging line sub-layers onto the main shape clips overlapping pattern paths cleanly inside the face.","하위 라인 레이어를 부모 도형 위로 드래그하면 외곽으로 넘쳐나온 거미줄/패턴 선들이 얼굴 안에 깔끔하게 갇히게 됩니다."]],"quizKo":"라인 레이어를 선택하고 얼굴 원형 레이어 위로 드래그하여 안으로 넣어 보세요.","answer":"Select the line layer and drag it onto the face ellipse layer to clip it inside."},{"tag":"GUIDE","title":"Smoothing Curved Node Paths ('Convert to Smooth')","koTitle":"Node Tool로 곡선 패스 매끄럽게 정돈하기","examples":[["Select all nodes with the Node Tool and click 'Convert to Smooth' in the top toolbar to soften sharp edges.","Node Tool로 모든 노드를 드래그하여 선택한 뒤 상단 툴바의 'Convert to Smooth'를 눌러 날카로운 모서리를 부드럽게 만들어 보세요."],["Converting nodes to smooth curves rounds out drawn character outlines for a fluid hand-drawn look.","노드를 부드러운 곡선으로 전환하면 직접 그린 캐릭터 테두리가 유연하고 자연스러운 손그림 스타일로 정리됩니다."]],"quizKo":"Node Tool로 패스를 전체 선택하고 상단 바의 Convert to Smooth 버튼을 눌러 보세요.","answer":"Drag all nodes with the Node Tool and click the Convert to Smooth button in the top toolbar."}]},"11":{"topic":"Character Details & Custom Tail Brush Creation","terms":[["Vector Curve Conversion ('Ctrl + Enter')","벡터 곡선 변형 (기본 도형 선택 후 'Ctrl + Enter'를 눌러 세부 조절 노드를 생성하고, 곡선을 자유롭게 구부려 유니크한 캐릭터나 사물 파츠를 제작하는 기능)"],["New Texture Image Brush ('Brushes Panel' → 'New Texture Image Brush')","새 텍스처 이미지 브러시 만들기 (작성한 캐릭터 꼬리 개체를 PNG로 저장한 뒤 불러와 원하는 선을 그릴 때 적용되는 커스텀 패스 브러시로 등록하는 기능)"]],"brainstormKo":"","s1":{"title":"Choosing Practice Concept & Character Details","subtitle":"연습하고 싶은 캐릭터 및 배경 컨셉 정하기","messages":[{"role":"teacher","en":"We only have two diploma sessions left! What would you like to work on today, backgrounds or characters?","ko":"이제 디플로마 과정이 두 세션밖에 안 남았네요! 오늘 배경과 캐릭터 중 어떤 걸 더 연습해보고 싶나요?"},{"role":"student","en":"I want to draw the <span class=\"slot\">[ 선택한 캐릭터/대상 ]</span> with <span class=\"slot\">[ 표정/소품 디테일 ]</span>.","ko":"네! 저는 [ 장소/배경 ]에 있는 [ 표정/소품 디테일 ]을 가진 [ 선택한 캐릭터/대상 ]을 그려보고 싶어요!","group":"s1-character-detail-hint"},{"role":"teacher","en":"Cool choice! Let's shape those unique details together!","ko":"멋진 선택이에요! 유니크한 세부 표현들을 함께 만들어봅시다!"}],"hints":[{"after":1,"group":"s1-character-detail-hint","label":"캐릭터 & 소품 세트 힌트","rows":[[["Sleeping tooth","자고 있는 치아"],["Cavity detail","충치 디테일"]],[["Black cat","검은 고양이"],["Green eyes","초록색 눈"]],[["Apple cake","사과 케이크"],["Apple slice topping","사과 조각 토핑"]]]}]},"s2":{"title":"Talking about Animals with Unique Tails","subtitle":"특이한 꼬리를 가진 동물과 브러시 활용","messages":[{"role":"teacher","en":"What is your favorite animal that has a unique pattern or fluffy tail?","ko":"특이한 무늬나 폭신폭신한 꼬리를 가진 동물 중 어떤 동물을 가장 좋아하나요?"},{"role":"student","en":"I love tigers and foxes because of their long striped and fluffy tails!","ko":"저는 긴 줄무늬 꼬리와 폭신한 꼬리를 가진 호랑이랑 여우를 가장 좋아해요!"},{"role":"teacher","en":"Great! Today, we'll turn those fun tail shapes into custom brushes so you can draw them in just one stroke!","ko":"좋아요! 오늘 그 재미있는 꼬리 모양들을 커스텀 브러시로 만들어서 한 번의 터치로 쉽게 그려볼 거예요!"}]},"patterns":[{"tag":"GUIDE","title":"Converting Shapes to Editable Curves ('Ctrl + Enter')","koTitle":"기본 도형을 자유 곡선으로 전환하기","examples":[["Select the basic shape, press Ctrl + Enter, and double-click to bend the lines with the Node Tool.","기본 도형을 선택하고 Ctrl + Enter를 누른 후, Node Tool로 선을 더블클릭해 자유롭게 곡선으로 구부려 보세요."],["Converting shapes to curves allows you to craft organic features like rounded cake slices or character eyes.","도형을 곡선으로 변환하면 사과 케이크 조각이나 캐릭터 표정 같은 유기적인 형태를 자유롭게 다듬을 수 있습니다."]],"quizKo":"도형을 선택하고 Ctrl + Enter를 눌러 노드 편집이 가능한 커브 상태로 만들어 보세요.","answer":"Select the shape and press Ctrl + Enter to convert it into editable curves."},{"tag":"GUIDE","title":"Direct Selecting Sub-Objects inside Groups ('Ctrl + Click')","koTitle":"Ctrl 클릭으로 그룹 내 특정 개체 바로 선택하기","examples":[["Hold the Ctrl key and click directly on the white tooth shape on the canvas to select it without ungrouping.","그룹을 해제하지 않고 Ctrl 키를 누른 채 캔버스 위의 흰색 치아 도형을 클릭하여 직접 선택해 보세요."],["Ctrl-clicking bypasses parent group hierarchies to speed up detail edits in complex character groups.","Ctrl 클릭을 활용하면 상위 그룹을 풀지 않고도 복잡한 캐릭터 일러스트의 특정 파츠만 빠르게 선택해 수정할 수 있습니다."]],"quizKo":"Ctrl 키를 누른 채 캐릭터의 특정 부위만 직접 클릭하여 선택해 보세요.","answer":"Hold Ctrl and click the target object directly to select it."},{"tag":"GUIDE","title":"Creating Custom Texture Image Brushes ('Brushes Panel' → 'New Texture Image Brush')","koTitle":"PNG 이미지로 새 텍스처 브러시 등록하기","examples":[["Open the Brushes panel menu and select 'New Texture Image Brush' to import your saved tail PNG file.","Brushes 패널 메뉴를 열고 'New Texture Image Brush'를 선택한 뒤 저장한 꼬리 PNG 파일을 불러와 보세요."],["Importing custom PNG images creates a unique texture brush that repeats your design along any path you draw.","커스텀 PNG 이미지를 불러오면 내가 그리는 모든 패스 선을 따라 디자인이 이어지는 유니크한 텍스처 브러시가 만들어집니다."]],"quizKo":"Brushes 패널 우측 상단 메뉴에서 새 텍스처 이미지 브러시 만들기를 누르고 저장한 이미지를 불러와 보세요.","answer":"Open the Brushes panel menu, click 'New Texture Image Brush', and import your saved PNG image."},{"tag":"GUIDE","title":"Adjusting Brush Size and Settings ('Double-Click Brush Thumbnail')","koTitle":"브러시 썸네일 더블클릭으로 크기 및 이름 설정하기","examples":[["Double-click the created tail brush thumbnail in the panel to rename it and adjust its stroke width size.","패널에 생성된 꼬리 브러시 썸네일을 더블클릭하여 브러시 이름을 정하고 선 두께 크기를 조절해 보세요."],["Double-clicking brush presets opens property settings where you can customize brush dynamics, width, and scale.","브러시 프리셋을 더블클릭하면 팝업 창이 열려 브러시의 세부 크기와 동작 특성을 자유롭게 수정할 수 있습니다."]],"quizKo":"브러시 썸네일을 두 번 누르고 크기와 이름을 원하는 대로 변경해 보세요.","answer":"Double-click the brush thumbnail in the panel to change its width size and name."}]},"12":{"topic":"Custom Brush Creation & Character Expressions for Picture Books","terms":[["Pencil Tool Sculpt Mode ('Pencil Tool' → 'Sculpt Mode')","펜슬 스컬프 모드 (패스 선을 그린 후 끊어진 선의 끝부분을 자연스럽게 이어 그리거나 결합하여 하나의 연속된 곡선으로 만드는 기능)"],["Texture Brush Stretch Mode ('Brush Editing' → 'Stretch / Red Line Control')","텍스처 브러시 늘리기 설정 (등록한 이미지 브러시의 세부 편집에서 빨간색 지정 선을 조절하여 캐릭터의 팔이나 몸통 등 특정 구간만 자연스럽게 늘어나도록 설정하는 기능)"]],"brainstormKo":"","s1":{"title":"Preparing Character Expressions & Poses for Picture Books","subtitle":"동화책 캐릭터의 다양한 표정과 포즈 연습하기","messages":[{"role":"teacher","en":"Today, we're practicing character poses and facial expressions for our picture books! What kind of character and expression would you like to create today?","ko":"오늘은 동화책에 들어갈 캐릭터의 포즈와 표정을 연습해 볼 거예요! 오늘 어떤 캐릭터와 표정을 만들어보고 싶나요?"},{"role":"student","en":"I want to draw a <span class=\"slot\">[ 캐릭터/동물 ]</span> with <span class=\"slot\">[ 표정/포즈 ]</span>.","ko":"네! 저는 [ 소품/음식 ]을 들고 [ 표정/포즈 ]를 짓고 있는 [ 캐릭터/동물 ]을 그려보고 싶어요!","group":"s1-expression-pair-hint"},{"role":"teacher","en":"Excellent! Expressing rich emotions and poses will make your picture book story so much more lively!","ko":"멋져요! 풍부한 감정과 포즈를 표현하면 여러분의 동화책 이야기가 훨씬 더 생동감 넘치게 될 거예요!"}],"hints":[{"after":1,"group":"s1-expression-pair-hint","label":"캐릭터 표정 & 포즈 세트 힌트","rows":[[["Surprised rabbit","놀란 토끼"],["Wide open mouth with teeth","이빨과 혀가 보이는 벌린 입"]],[["Confident king","당당한 국왕 캐릭터"],["Crying sad face","눈물 흘리는 슬픈 표정"]]]}]},"s2":{"title":"Diploma Course Graduation & Next Step to Editor Course","subtitle":"디플로마 과정 수료 및 에디터 코스 안내","messages":[{"role":"teacher","en":"Can you believe it? Today is the very last session of our Diploma course! How do you feel?","ko":"믿겨지나요? 오늘이 우리 디플로마 코스의 마지막 수업이에요! 기분이 어때요?"},{"role":"student","en":"I can't believe we finished 12 sessions! I'm so excited for the next Editor course to make my own book!","ko":"12번의 수업을 다 마쳤다니 믿기지 않아요! 나만의 책을 만드는 다음 에디터 코스가 정말 기대돼요!"},{"role":"teacher","en":"You've grown so much! In the Editor course, we will start building your full story and publishing your picture book!","ko":"여러분 실력이 정말 많이 늘었어요! 에디터 코스에서는 여러분만의 스토리 빌딩과 동화책 출판을 본격적으로 시작할 거예요!"}]},"patterns":[{"tag":"GUIDE","title":"Connecting Lines with Pencil Tool Sculpt Mode ('Pencil Tool' + 'Sculpt Mode')","koTitle":"스컬프 모드로 패스 선 자연스럽게 이어 그리기","examples":[["Turn on Sculpt mode with the Pencil Tool to connect separate line segments seamlessly into one path.","Pencil Tool 선택 후 Sculpt 모드를 활성화하면 끊어진 선들을 하나의 패스로 자연스럽게 이어 그릴 수 있습니다."],["Using Sculpt mode allows you to extend character arms or body outlines without creating broken line layers.","Sculpt 모드를 활용하면 레이어가 분리되거나 선이 끊기지 않고 캐릭터의 팔이나 몸통 라인을 매끄럽게 연결할 수 있습니다."]],"quizKo":"Pencil Tool을 선택하고 Sculpt 버튼을 활성화하여 끊어진 선을 깔끔하게 이어보세요.","answer":"Select the Pencil Tool, turn on Sculpt mode, and drag from the line endpoint to connect them."},{"tag":"GUIDE","title":"Setting Stretch Areas for Texture Brushes ('Brushes Panel' → 'Brush Editing' → 'Stretch')","koTitle":"브러시 늘어남 구간 설정하기","examples":[["Open brush editing, select Stretch, and drag the red lines to specify which part of the character arm stretches smoothly.","브러시 편집 창에서 '늘리기'를 선택하고 빨간 선을 드래그하여 캐릭터 팔의 어느 부분이 자연스럽게 늘어날지 지정해 보세요."],["Adjusting the red stretch boundaries ensures the hand and shoulder stay fixed while the middle arm section extends naturally.","빨간색 늘어남 경계선을 조절하면 손과 어깨 형태는 유지되면서 팔 중앙 부분만 자연스럽게 늘어나게 됩니다."]],"quizKo":"브러시 편집에서 늘리기를 선택하고 빨간 선을 드래그하여 늘어날 구간을 지정해 보세요.","answer":"Open the brush editing menu, click Stretch, and drag the red lines to the area you want to extend."},{"tag":"GUIDE","title":"Adding Random Dynamics to Custom Waterdrop Brushes ('Brushes Panel' → 'Dynamics')","koTitle":"물방울 브러시 다이나믹스 및 지터 설정하기","examples":[["Adjust size, rotation, and scatter jitter in the Dynamics menu to give your custom waterdrop brush natural randomness.","Dynamics 메뉴에서 크기, 회전, 흩뿌리기 지터 값을 조절하면 물방울 브러시에 자연스러운 무작위 효과를 줄 수 있습니다."],["Adding color jitter creates subtle color variations across repeated brush strokes for decorating picture book scenes.","색조 지터(Color Jitter)를 조절하면 브러시를 터치할 때마다 다양한 색상이 자연스럽게 섞여 나와 동화책 장면을 꾸미기 좋습니다."]],"quizKo":"Dynamics 메뉴에서 크기와 회전 지터를 조절하여 무작위로 그려지는 브러시를 만들어 보세요.","answer":"Go to the Dynamics tab in the Brushes panel and adjust the Size and Rotation Jitter values."},{"tag":"GUIDE","title":"Creating Lighting Effects with Transparency Tool ('Transparency Tool' / 'Y' + 'Opacity')","koTitle":"투명도 도구로 조명 연출하기","examples":[["Select the light shape, press Y for the Transparency Tool, and drag from top to bottom to create a soft glowing light beam.","조명 모양 도형을 선택한 뒤 단축키 Y를 눌러 Transparency Tool을 실행하고, 위에서 아래로 드래그하여 은은한 빛 효과를 표현해 보세요."],["Combining trapezoid shapes with gradient transparency adds realistic lighting effects to indoor background scenes.","사다리꼴 도형에 그라데이션 투명도를 적용하면 실내 배경 인테리어에 어울리는 사실적인 조명 비춤 효과를 연출할 수 있습니다."]],"quizKo":"사다리꼴 도형을 그리고 Transparency Tool(단축키 Y)을 사용해 은은한 조명 효과를 표현해 보세요.","answer":"Draw a trapezoid, press Y to activate the Transparency Tool, and drag across the shape to apply a transparency gradient."}]}};

function renderHome() {
  activeLesson = null;
  document.title = 'English Diploma';
  app.innerHTML = `
    <main class="list-page">
      <div class="eyebrow">ENGLISH DIPLOMA</div>
      <h1>Diploma Course</h1>
      <p class="lead">화살표 버튼 또는 키보드 방향키를 사용하여 페이지를 넘길 수 있습니다.</p>
      <section class="lesson-grid" aria-label="Diploma lesson list">
        ${Array.from({length:12}, (_,i) => {
          const n = i + 1;
          const lesson = LESSONS[n];
          const active = Boolean(lesson);
          return `
            <button class="lesson-card ${active ? 'active' : 'disabled'}" ${active ? `data-lesson="${n}"` : 'disabled'}>
              <strong>DIPLOMA ${String(n).padStart(2,'0')}</strong>
              <span class="meta">${active ? lesson.topic : ' '}</span>
              <span class="arrow-dot">${active ? '→' : '·'}</span>

        }).join('')}

  app.querySelectorAll('[data-lesson]').forEach(btn => {
    btn.addEventListener('click', () => renderLesson(Number(btn.dataset.lesson)));

}

function langCard(en, ko, extra='') {
  return `<article class="language-card ${extra} reveal" data-reveal><p class="en">${en}</p><p class="ko">${ko}</p></article>`;
}

function bubble(m) {
  const group = m.group ? ` data-step-group="${escAttr(m.group)}"` : '';
  return `
    <div class="chat-row ${m.role} reveal" data-reveal${group}>
      <article class="bubble">
        <div class="speaker">${m.role === 'teacher' ? 'Teacher' : 'Student'}</div>
        ${m.note ? `<div class="action-note">${m.note}</div>` : ''}
        <div class="en">${m.en}</div>
        <div class="ko">${m.ko}</div>
      </article>
    </div>`;
}

function hintBox(hint) {
  const group = hint.group ? ` data-step-group="${escAttr(hint.group)}"` : '';
  const hasRows = Array.isArray(hint.rows) && hint.rows.length;
  const hintContent = hasRows
    ? hint.rows.map(row => `
        <div class="hint-row">
          ${row.map(([en,ko]) => `<span class="hint-row-item">${en}<span>${ko}</span></span>`).join('')}
        </div>`).join('')
    : hint.items.map(([en,ko]) => `<span class="hint-chip">${en}<span>${ko}</span></span>`).join('');

  return `
    <aside class="hint-box reveal" data-reveal${group}>
      <strong>💡 Word Hint Box · ${hint.label}</strong>
      <div class="hint-list${hasRows ? ' grouped' : ''}">
        ${hintContent}
      </div>
    </aside>`;
}

function renderMessagesWithHint(situation) {
  return situation.messages.map((m, index) => {
    const hints = Array.isArray(situation.hints)
      ? situation.hints.filter(h => h.after === index)
      : (situation.hint && situation.hint.after === index ? [situation.hint] : []);
    const extra = hints.map(hintBox).join('');
    return bubble(m) + extra;
  }).join('');
}

const QUIZ_VISIBLE_TERMS = {
  '2-2': ["separate"],
  '3-1': ["stretch", "outward"],
  '4-1': ["Convert to Smooth"],
  '4-2': ["Dry Media"],
  '4-3': ["underwater", "light reflections"],
  '5-0': ["keyhole shape"],
  '5-3': ["remote control"],
  '7-0': ["gap"],
  '7-2': ["Increase"],
  '8-0': ["road line"],
  '8-1': ["inward"],
  '8-2': ["express"],
  '8-3': ["impressed"],
  '9-0': ["Shift + X"],
  '9-1': ["Outer Shadow"],
  '9-2': ["Cloud tool"],
  '9-3': ["Node tool"],
  '10-0': ["trapezoid"],
  '10-1': ["trim"],
  '10-3': ["convert to smooth"],
  '11-0': ["editable"],
  '11-1': ["target object"],
  '11-2': ["new texture image brush"],
  '12-0': ["sculpt mode", "endpoint"],
  '12-1': ["extend"],
  '12-2': ["jitter"],
  '12-3': ["transparency gradient"]
};

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeRegExp(text) {
  return String(text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function renderMaskSegment(text, isLeading = false) {
  if (!text) return '';
  const match = String(text).match(/^(\s*)([\s\S]*?)(\s*)$/);
  const leadingSpace = match ? match[1] : '';
  const core = match ? match[2] : String(text);
  const trailingSpace = match ? match[3] : '';

  if (!core) return escapeHtml(text);

  return `${escapeHtml(leadingSpace)}<span class="mask${isLeading ? ' leading' : ''}">${escapeHtml(core)}</span>${escapeHtml(trailingSpace)}`;
}

function renderMaskedAnswer(answer, lessonNumber, patternIndex) {
  const source = String(answer);
  const terms = QUIZ_VISIBLE_TERMS[`${lessonNumber}-${patternIndex}`] || [];
  let html = '<span class="quiz-question" aria-hidden="true">?</span>';

  if (!terms.length) {
    return html + renderMaskSegment(source, true);
  }

  const sorted = [...terms].sort((a, b) => b.length - a.length);
  const regex = new RegExp(sorted.map(escapeRegExp).join('|'), 'gi');
  const matches = [...source.matchAll(regex)];

  if (!matches.length) {
    return html + renderMaskSegment(source, true);
  }

  let cursor = 0;
  let usedLeadingMask = false;

  matches.forEach(match => {
    const index = match.index ?? 0;
    const hiddenBefore = source.slice(cursor, index);
    if (hiddenBefore) {
      html += renderMaskSegment(hiddenBefore, !usedLeadingMask);
      if (hiddenBefore.trim()) usedLeadingMask = true;
    }

    let visible = match[0];
    cursor = index + match[0].length;

    // If punctuation is attached directly to a revealed keyword/phrase,
    // reveal that punctuation with the keyword as one unit.
    const punctuation = source.slice(cursor).match(/^[.,!?;:…]+/);
    if (punctuation) {
      visible += punctuation[0];
      cursor += punctuation[0].length;
    }

    html += `<span class="answer-keyword">${escapeHtml(visible)}</span>`;
  });

  const hiddenAfter = source.slice(cursor);
  if (hiddenAfter) {
    html += renderMaskSegment(hiddenAfter, !usedLeadingMask);
  }

  return html;
}

function positionQuizQuestionMarks(root = document) {
  root.querySelectorAll('.masked-answer').forEach(answerEl => {
    const question = answerEl.querySelector('.quiz-question');
    const leadingMask = answerEl.querySelector('.mask.leading') || answerEl.querySelector('.mask');
    if (!question || !leadingMask) return;

    const rects = leadingMask.getClientRects();
    if (!rects.length) return;

    const firstRect = rects[0];
    const answerRect = answerEl.getBoundingClientRect();
    question.style.left = `${firstRect.left - answerRect.left + (firstRect.width / 2)}px`;
    question.style.top = `${firstRect.top - answerRect.top + (firstRect.height / 2)}px`;
  });
}

function refreshQuizQuestionMarks() {
  requestAnimationFrame(() => positionQuizQuestionMarks());
}

function renderPattern(p, index, lessonNumber) {
  const no = String(index + 1).padStart(2,'0');
  const exampleCards = (p.examples || []).map((ex, i) => `
    <article class="language-card reveal" data-reveal>
      <span class="example-label">Example ${i + 1}</span>
      <p class="en">${ex[0]}</p>
      <p class="ko">${ex[1]}</p>
    </article>`).join('');

  const quiz = p.quizKo && p.answer ? `
    <article class="quiz-card reveal" data-reveal role="button" tabindex="0" aria-label="Mini quiz answer reveal">
      <span class="quiz-label">Mini Quiz</span>
      <div class="masked-answer">${renderMaskedAnswer(p.answer, lessonNumber, index)}</div>
      <p class="ko" style="margin-top:10px;">${p.quizKo}</p>
    </article>` : '';

  return `
    <section class="pattern-section" id="pattern-${no}">
      <h3 class="pattern-subtitle reveal" data-reveal><span class="tag">${no}${p.tag ? ` · ${p.tag}` : ''}</span>${p.title}<br><span style="font-size:14px;color:#ffffff;font-weight:400;">${p.koTitle}</span></h3>
      <div class="content-stack">${exampleCards}${quiz}</div>
    </section>`;
}

  app.innerHTML = `
    <main class="lesson-view">

        </div>
        <div class="title-wrap">

          <div class="part-inner">
            <div class="part-intro part-intro-static">

              <h2>Key Design Terms</h2>
              <p class="part-description">영문 용어와 국문 설명을 한 세트씩 확인합니다.</p>
            </div>

              ${lesson.terms.map(t => langCard(t[0], t[1], 'term-card')).join('')}

              <div class="part-kicker">PART 02</div>
              <h2>Classroom Small Talk</h2>
              <p class="part-description">Teacher는 왼쪽 흰색, Student는 오른쪽 연한 블루 말풍선으로 구분됩니다.</p>
            </div>

              <aside class="notice-card reveal" data-reveal>
                <span class="notice-label">Brainstorming</span>
                <div class="en">Let's warm up our brains and speak in English before we start drawing!</div>
                ${lesson.brainstormKo ? `<div class="ko">${lesson.brainstormKo}</div>` : ''}

              ${lesson.s2.missionEn ? `<aside class="notice-card reveal" data-reveal>
                <span class="notice-label">Mission</span>
                <div class="en">${lesson.s2.missionEn}</div>

              </aside>` : ''}
              ${lesson.s2.messages.map(bubble).join('')}
            </div>
          </div>
        </section>

        <section class="part" id="part-3" data-part="2">
          <div class="part-inner">
            <div class="part-intro reveal" data-reveal>
              <div class="part-kicker">PART 03</div>
              <h2>Classroom Master Patterns</h2>
              <p class="part-description">제공된 Example과 Mini Quiz를 순서대로 확인합니다.</p>
            </div>
            ${lesson.patterns.map((p, i) => renderPattern(p, i, lessonNumber)).join('')}
            <div class="complete-card reveal" data-reveal>
              <strong>DIPLOMA ${String(lessonNumber).padStart(2,'0')} Complete</strong>

          </div>
